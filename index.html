<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a try</title>
</head>

<style>
    body {
        text-align: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: linear-gradient(0deg,grey, white) center center / cover no-repeat fixed;
    }

    #main {
        align-items: center;
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    #control_buttons {
        order: 2;
        display: flex;
        flex-direction: row;
        justify-content: center;
        background-color: white;
        margin: 50px;
        border-radius: 10px;
        border-style: solid;
    }

    #control_buttons > * > *{
        margin: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
    }

    #vrp, #fp {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 10px;
        border-style: solid;
        margin: 10px;
    }

    #inputs_fp, #inputs_vrp{
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    #inputs_vrp > *, #inputs_fp > * {
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 10px;
    }

</style>

<body>
    <h1>Trabalho 2 - CG</h1>

    <div id="main">
        <div id="control_buttons">
            <div id="vrp">
                <h2 class="title">VRP</h2>
                <div id="inputs_vrp">
                    <div>
                        <label for="cam_x">X</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="x_cam" id="cam_x" value="0" step="0.1">
                    </div>
                    <div>
                        <label for="cam_y">Y</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="y_cam" id="cam_y" value="0.7" step="0.1">
                    </div>
                    <div>
                        <label for="cam_z">Z</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="z_cam" id="cam_z" value="1" step="0.1">
                    </div>
                </div>
            </div>
            <div id="fp">
                <h2 class="title">FP</h2>
                <div id="inputs_fp">
                    <div>
                        <label for="focal_x">X</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="focal_x" id="focal_x" value="0" step="0.1">
                    </div>
                    <div>
                        <label for="focal_y">Y</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="focal_y" id="focal_y" value="0" step="0.1">
                    </div>
                    <div>
                        <label for="focal_z">Z</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="focal_z" id="focal_z" value="0" step="0.1">
                    </div>
                    <div>
                        <label for="distance_point">DP</label>
                        <input style= "width: 50px" type="number" oninput=change_world() name="distance_point" id="distance_point" value="240" step="1">
                    </div>
            </div>
        </div>
    </div>

    <!-- <script>var exports = {};</script> -->
    <script src="code/surface.js"></script>
    <script src="code/camera.js"></script>
    <script src="code/universe.js"></script>
    <script src="code/spline.js"></script>
    <script src="code/main.js"></script>
</body>
</html>

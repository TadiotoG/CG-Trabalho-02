<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a try</title>
</head>

<style>
    body {
        text-align: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: linear-gradient(0deg,grey, white) center center / cover no-repeat fixed;
    }

    #main {
        align-items: center;
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    #control_buttons {
        order: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background-color: white;
        margin: 50px;
        border-radius: 10px;
        border-style: solid;
    }
    
    .pop_up {
        position: absolute;
        min-width: 500px;
        min-height: 400px;
        display: none;
        flex-direction: column;
        justify-content: center;
        background-color: rgb(255, 255, 255);
        margin: 50px;
        border-color: rgb(38, 0, 253);
        border-radius: 10px;
        border-style: solid;
    }

    .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        margin: 10px;
    }

    #last_row > *, #almost_last_row > * {
        margin-left: 30px;
        width: 170px;
        height: 30px;
    }

    .column {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 10px;
    }

    /* #control_buttons > * > *{
        margin: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
    } */

    #vrp, #fp {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 10px;
        border-style: solid;
        margin: 10px;
    }

    #inputs_fp, #inputs_vrp{
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    #inputs_vrp > *, #inputs_fp > * {
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 10px;
    }

    .pop_up > * {
        margin: 10px;
    }

    #mensagem_clique {
    position: fixed; /* Fixa a div na tela, mesmo ao rolar */
    top: 10px; /* Distância do topo */
    left: 50%; /* Centraliza horizontalmente */
    transform: translateX(-50%); /* Ajusta a centralização */
    background-color: rgba(0, 0, 0, 0.8); /* Fundo escuro translúcido */
    color: white; /* Texto branco */
    padding: 10px 20px; /* Espaçamento interno */
    border-radius: 8px; /* Borda arredondada */
    font-size: 16px; /* Tamanho do texto */
    z-index: 1000; /* Garante que fique sobre outros elementos */
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Sombra sutil */
    opacity: 0; /* Começa invisível */
    transition: opacity 0.4s ease-in-out; /* Suaviza a transição */

}


</style>

<body>
    <h1>Trabalho 2 - CG</h1>

    <div id="main">
        <div id="control_buttons">
            <div id="first_row" class="row">
                <div id="vrp">
                    <h2 class="title">VRP</h2>
                    <div id="inputs_vrp">
                        <div>
                            <label for="cam_x">X</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="x_cam" id="cam_x" value="0" step="1">
                        </div>
                        <div>
                            <label for="cam_y">Y</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="y_cam" id="cam_y" value="10" step="1">
                        </div>
                        <div>
                            <label for="cam_z">Z</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="z_cam" id="cam_z" value="10" step="1">
                        </div>
                    </div>
                </div>
                <div id="fp">
                    <h2 class="title">FP</h2>
                    <div id="inputs_fp">
                        <div>
                            <label for="focal_x">X</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="focal_x" id="focal_x" value="0" step="0.1">
                        </div>
                        <div>
                            <label for="focal_y">Y</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="focal_y" id="focal_y" value="0" step="0.1">
                        </div>
                        <div>
                            <label for="focal_z">Z</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="focal_z" id="focal_z" value="0" step="0.1">
                        </div>
                        <div>
                            <label for="distance_point">DP</label>
                            <input style= "width: 50px" type="number" oninput=change_world() name="distance_point" id="distance_point" value="240" step="1">
                        </div>
                    </div>
                </div>
            </div>

            <div id="almost_last_row" class="row"> 
                <input type="button" id="call_create_s" value="Transladar superficie" onclick=call_translada_surface()>
                <input type="button" id="call_create_s" value="Escala em superficie" onclick=call_escala_surface()>
                <input type="button" id="call_create_s" value="Rotacionar superficie" onclick=call_rotaciona_surface()>
            </div>
            
            <div id="last_row" class="row"> 
                <input type="button" id="call_create_s" value="Criar nova superficie" onclick=call_create_surface()>
                <input type="button" id="alter_cp" value="Alterar Ponto de controle" onclick=call_change_dot()>
                <input type="button" id="delete_s" value="Excluir superficie" onclick=call_remove_surf()>
            </div>
            
        </div>

        <div id="new_surface" class="pop_up">
            <h2 class="title">Nova Superfície</h2>
            <div class="row">
                <div class="column">
                    <label for="surface_begin_x">X</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="surface_begin_x" id="surface_begin_x" value="0" step="10">
                </div>
                <div class="column">
                    <label for="surface_begin_y">Y</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="surface_begin_y" id="surface_begin_y" value="0" step="15">
                </div>
                <div class="column">
                    <label for="surface_begin_z">Z</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="surface_begin_z" id="surface_begin_z" value="0" step="10">
                </div>
            </div>
            <div class="row">
                <div class="column">
                    <label for="cp_i">Quant. CPI</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="cp_i" id="cp_i" value="4" step="1">
                </div>
                <div class="column">
                    <label for="cp_j">Quant. CPJ</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="cp_j" id="cp_j" value="4" step="1">
                </div>
            </div>
            <div class="row">
                <div class="column">
                    <label for="res_i">Res. i</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="res_i" id="res_i" value="20" step="1">
                </div>
                <div class="column">
                    <label for="res_j">Res. j</label>
                    <input style= "width: 50px" type="number" oninput=change_world() name="res_j" id="res_j" value="20" step="1">
                </div>
            </div>
            <div>
                <input type="button" id="create_surface" onclick=create_surface() value="Criar">
                <input type="button" id="cancel_create_s" onclick=window_create_s_disappears() value="Cancelar">
            </div>
        </div>

        <div id="change_dot" class="pop_up">
            <h2 class="title">Alterar Ponto de controle</h2>
            <div class="row">
                <div class="column">
                    <label for="change_dot_x">X</label>
                    <input style= "width: 50px" type="number" name="change_dot_x" id="change_dot_x" value="0" step="1">
                </div>
                <div class="column">
                    <label for="change_dot_y">Y</label>
                    <input style= "width: 50px" type="number" name="change_dot_y" id="change_dot_y" value="0" step="1">
                </div>
                <div class="column">
                    <label for="change_dot_z">Z</label>
                    <input style= "width: 50px" type="number" name="change_dot_z" id="change_dot_z" value="0" step="1">
                </div>
            </div>
            <div>
                <input type="button" id="button_change_dot" onclick=change_dot() value="Alterar">
                <input type="button" id="cancel_change_dot" onclick=window_change_dot_disappears() value="Cancelar">
            </div>
        </div>

        <div id="trans_surf" class="pop_up">
            <h2 class="title">Transladar em quanto a superficie?</h2>
            <div class="row">
                <div class="column">
                    <label for="trans_surf_x">X</label>
                    <input style= "width: 50px" type="number" name="trans_surf_x" id="trans_surf_x" value="0" step="1">
                </div>
                <div class="column">
                    <label for="trans_surf_y">Y</label>
                    <input style= "width: 50px" type="number" name="trans_surf_y" id="trans_surf_y" value="0" step="1">
                </div>
                <div class="column">
                    <label for="trans_surf_z">Z</label>
                    <input style= "width: 50px" type="number" name="trans_surf_z" id="trans_surf_z" value="0" step="1">
                </div>
            </div>
            <div>
                <input type="button" id="button_translada_s" onclick=translada_surf() value="Alterar">
                <input type="button" id="cancel_translada_s" onclick=window_translada_s_disappears() value="Cancelar">
            </div>
        </div>

        <div id="escala_surf" class="pop_up">
            <h2 class="title">Escalar em quanto a superficie?</h2>
            <div class="row">
                <div class="column">
                    <label for="escala">X</label>
                    <input style= "width: 50px" type="number" name="escala" id="escala" value="1" step="0.1">
                </div>
            </div>
            <div>
                <input type="button" id="button_escala_s" onclick=escala_surf() value="Alterar">
                <input type="button" id="cancel_escala_s" onclick=window_escala_s_disappears() value="Cancelar">
            </div>
        </div>

        <div id="rotaciona_surf" class="pop_up">
            <h2 class="title">Rotacionar em quanto a superficie?</h2>
            <div class="row">
                <div class="column">
                    <label for="rotaciona_surf_x">X</label>
                    <input style= "width: 50px" type="number" name="rotaciona_surf_x" id="rotaciona_surf_x" value="0" step="0.1">
                </div>
                <div class="column">
                    <label for="rotaciona_surf_y">Y</label>
                    <input style= "width: 50px" type="number" name="rotaciona_surf_y" id="rotaciona_surf_y" value="0" step="0.1">
                </div>
                <div class="column">
                    <label for="rotaciona_surf_z">Z</label>
                    <input style= "width: 50px" type="number" name="rotaciona_surf_z" id="rotaciona_surf_z" value="0" step="0.1">
                </div>
            </div>
            <div>
                <input type="button" id="button_rotaciona_s" onclick=rotaciona_surf() value="Alterar">
                <input type="button" id="cancel_rotaciona_s" onclick=window_rotaciona_s_disappears() value="Cancelar">
            </div>
        </div>
    </div>
    <div id="mensagem_clique">
        <h2>Clique próximo aos pontos de controle para que seja selecionado corretamente!</h2>
    </div>

    <!-- <script>var exports = {};</script> -->
    <script src="code/surface.js"></script>
    <script src="code/camera.js"></script>
    <script src="code/universe.js"></script>
    <script src="code/spline.js"></script>
    <script src="code/main.js"></script>
</body>
</html>
